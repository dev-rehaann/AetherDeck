; AetherDeck — ESP32-S3 Wi-Fi/BLE security toolkit
; Retarget: set `board` to your exact S3 variant. For PSRAM (R-variant boards),
; add -DBOARD_HAS_PSRAM and set board_build.arduino.memory_type.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
    h2zero/NimBLE-Arduino@^2.5
